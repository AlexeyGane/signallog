# --- Standards and specifications ---

[[source]]
id        = "csl-1-0-2"
type      = "standard"
title     = "Citation Style Language 1.0.2 Specification"
author    = ["Rintze M. Zelle", "Brenton M. Wiernik", "Frank G. Bennett, Jr.", "Bruce D'Arcus", "Denis Maier"]
publisher = "Citation Style Language project"
version   = "1.0.2"
url       = "https://docs.citationstyles.org/en/stable/specification.html"
tier      = 1
stability = "pinned"
note      = "appendix III lists the item types, appendix IV the variables"

[[source]]
