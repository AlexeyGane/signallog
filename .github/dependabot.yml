version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*", "Azure.*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: "pip"
    directory: "/eng/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docs(deps)"
