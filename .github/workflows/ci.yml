# ADR 0004 — continuous integration. Required status checks for the main-protection ruleset:
# "ci / pr-title" and "ci / build".
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Conventional Commits and work item reference
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits: <type>(<scope>): <summary> AB#<id>"
            exit 1
          fi
          # TEMPORARY: warning instead of error until the Azure Boards organization exists
          # (blocked by Azure sign-up support request). Restore "::error::" and "exit 1" afterwards.
          if [[ "$AUTHOR" != "dependabot[bot]" && ! "$TITLE" =~ AB#[0-9]+ ]]; then
            echo "::warning::PR title should reference an Azure Boards work item: AB#<id>"
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SignalLog.slnx

      - name: Build (analyzers, warnings as errors)
        run: dotnet build SignalLog.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution SignalLog.slnx --no-build --configuration Release

      - name: Format
        run: dotnet format SignalLog.slnx --verify-no-changes --no-restore

      - name: Banned API fitness function (ADR 0012, ADR 0017)
        shell: pwsh
        run: ./eng/Test-BannedApi.ps1
