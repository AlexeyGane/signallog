# ADR 0020 — documentation site. Strict build on pull requests; build and deploy to GitHub Pages on main.
name: docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "overrides/**"
      - "eng/docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "overrides/**"
      - "eng/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Zensical (hash-pinned)
        run: python -m pip install --require-hashes -r eng/docs/requirements.txt

      - name: "Build (strict: invalid links or anchors fail)"
        run: zensical build --clean --strict

      - name: Remove unlisted pages from sitemap.xml
        run: python eng/docs/remove-unlisted-from-sitemap.py site

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
